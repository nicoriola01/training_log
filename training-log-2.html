<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train">
<title>Training Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F1218'/%3E%3Crect x='6' y='14' width='4' height='4' rx='1' fill='%23FFB020'/%3E%3Crect x='22' y='14' width='4' height='4' rx='1' fill='%23FFB020'/%3E%3Crect x='10' y='15' width='12' height='2' fill='%23FFB020'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0F1218; --surface:#171B23; --surface2:#1F2530; --line:#2B323F;
    --ink:#EAEEF5; --muted:#8B94A4; --faint:#5C6675;
    --accent:#FFB020; --accent-ink:#0F1218; --heat:#FF6A3D; --cool:#3FC7B4;
    --ok:#57C973; --danger:#E5484D;
    --r:14px; --tap:46px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.45;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
  }
  body.timer-active{padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;font-weight:750;letter-spacing:-0.01em}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
  a{color:var(--accent)}

  header{
    position:sticky;top:0;z-index:20;background:rgba(15,18,24,.86);
    backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--line);padding:10px 16px 8px;
  }
  .weekbar{display:flex;align-items:center;gap:10px}
  .wk{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.15}
  .wk .wknum{font-size:1.35rem;font-weight:800;letter-spacing:-0.02em}
  .wk .phase{font-size:.82rem;color:var(--accent);font-weight:650;margin-top:1px;text-align:center}
  .stepbtn{
    width:var(--tap);height:var(--tap);min-width:var(--tap);border-radius:12px;
    background:var(--surface2);border:1px solid var(--line);color:var(--ink);
    font-size:1.4rem;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .stepbtn:active{background:var(--surface)}
  .stepbtn:disabled{opacity:.35}
  .metarow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.deload{color:var(--heat);border-color:var(--heat)}
  .bw{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.85rem}
  .bw input{width:64px;text-align:right;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
  .hint{margin-top:8px;font-size:.85rem;color:var(--muted)}

  nav.tabs{display:flex;gap:7px;overflow-x:auto;padding:11px 16px 3px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:9px 13px;border-radius:11px;font-size:.86rem;font-weight:650;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
  .tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

  main{padding:12px 16px 0;max-width:640px;margin:0 auto}
  .daytitle{font-size:1.15rem;margin:6px 2px 2px}
  .daysub{color:var(--muted);font-size:.85rem;margin:0 2px 10px}
  .daysub b{color:var(--cool);font-weight:700}
  .summary{display:flex;gap:14px;margin:0 2px 12px;font-size:.8rem;color:var(--muted)}
  .summary b{color:var(--ink);font-weight:750}

  details.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px;overflow:hidden}
  details.tool>summary{padding:11px 13px;font-weight:650;font-size:.9rem;list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
  details.tool>summary::-webkit-details-marker{display:none}
  details.tool>summary::after{content:"+";font-size:1.2rem}
  details.tool[open]>summary::after{content:"–"}
  .toolbody{padding:0 13px 13px}
  .prow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
  .prow .fld{flex:1;min-width:90px}
  .prow label{display:block;font-size:.72rem;color:var(--faint);margin-bottom:4px}
  .prow input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px}
  .plates{margin-top:11px;font-size:.95rem;line-height:1.5}
  .plates .p{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin:2px 3px 0 0;font-weight:700}

  .ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 13px 11px;margin-bottom:11px}
  .exhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .exname{font-size:1.02rem;font-weight:700;letter-spacing:-0.01em}
  .extarget{font-size:.78rem;color:var(--accent);font-weight:650;white-space:nowrap}
  .last{font-size:.76rem;color:var(--faint);margin-top:3px;min-height:1em}
  .last b{color:var(--muted);font-weight:650}

  table.sets{width:100%;border-collapse:collapse;margin-top:9px}
  table.sets th{font-size:.68rem;color:var(--faint);font-weight:650;text-align:center;padding:0 0 4px}
  table.sets th.lead{text-align:left;padding-left:2px}
  table.sets td{padding:3px 3px}
  table.sets tr.done .cell{border-color:rgba(87,201,115,.5);background:rgba(87,201,115,.08)}
  .setno{color:var(--muted);font-size:.9rem;text-align:center;width:24px}
  .cell{width:100%;text-align:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 3px;min-height:var(--tap)}
  .cell:focus{outline:none;border-color:var(--accent);background:#232a36}
  .chk{width:40px;height:40px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--faint);font-size:1.05rem;line-height:1}
  tr.done .chk{background:var(--ok);border-color:var(--ok);color:#0b1f13}
  .delset{width:30px;height:38px;border-radius:9px;background:transparent;border:1px solid transparent;color:var(--faint);font-size:1.05rem;line-height:1}
  .delset:active{color:var(--danger)}
  .exactions{display:flex;gap:8px;margin-top:9px}
  .mini{flex:1;padding:10px;border-radius:10px;font-size:.82rem;font-weight:650;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
  .mini:active{background:#232a36}
  .mini.ghost{color:var(--muted)}
  .e1rm{font-size:.72rem;color:var(--faint);text-align:right;margin-top:5px;min-height:.9em}

  textarea.notes{width:100%;min-height:74px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;resize:vertical;line-height:1.5}
  textarea.notes:focus{outline:none;border-color:var(--accent)}
  .lbl{font-size:.72rem;color:var(--faint);font-weight:700;margin:16px 2px 6px}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:.78rem;color:var(--muted);margin:0 2px 5px;font-weight:600}
  .field select,.field input.big{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:13px}
  .card h3{font-size:1rem;margin-bottom:2px}
  .card .cap{font-size:.78rem;color:var(--muted);margin-bottom:8px}
  .chart{width:100%;height:auto;display:block;margin-top:4px}
  .axl{fill:var(--faint);font-size:9px}
  .axis{stroke:var(--line);stroke-width:1}
  .empty{color:var(--faint);font-size:.85rem;padding:14px 2px}
  .best{font-size:.8rem;color:var(--cool);font-weight:700;margin-top:6px}
  .twocharts h4{font-size:.78rem;color:var(--muted);font-weight:650;margin:10px 0 0}

  details.ref{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:16px 0;overflow:hidden}
  details.ref>summary{padding:14px;font-weight:700;list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  details.ref>summary::-webkit-details-marker{display:none}
  details.ref>summary::after{content:"+";color:var(--muted);font-size:1.3rem}
  details.ref[open]>summary::after{content:"–"}
  .refbody{padding:0 14px 14px;font-size:.86rem;color:var(--muted);line-height:1.55}
  .refbody h4{color:var(--ink);font-size:.9rem;margin:12px 0 4px}

  .foot{display:flex;gap:9px;margin:22px 0 10px}
  .foot button{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:.9rem;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
  .foot button:active{background:var(--surface2)}
  .foot button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .credit{text-align:center;color:var(--faint);font-size:.72rem;margin:6px 0 4px}

  #timerbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
    background:rgba(23,27,35,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    transform:translateY(120%);transition:transform .22s;
  }
  body.timer-active #timerbar{transform:translateY(0)}
  #timerbar.done{border-top-color:var(--ok)}
  .trow{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
  .tlabel{font-size:.72rem;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tlabel b{color:var(--ink);font-weight:700}
  .tcount{font-size:1.5rem;font-weight:800;min-width:74px;text-align:center}
  #timerbar.done .tcount{color:var(--ok);font-size:1.05rem}
  .tbtn{height:40px;min-width:44px;padding:0 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:.85rem}
  .tbtn.skip{background:transparent;color:var(--muted)}
  .tprog{height:4px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:8px auto 0;max-width:640px}
  .tprog i{display:block;height:100%;background:var(--accent);width:100%}
  #timerbar.done .tprog i{background:var(--ok)}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:.85rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="weekbar">
    <button class="stepbtn" id="prev" aria-label="Previous week">‹</button>
    <div class="wk"><div class="wknum num" id="wknum">Week 1</div><div class="phase" id="phase"></div></div>
    <button class="stepbtn" id="next" aria-label="Next week">›</button>
  </div>
  <div class="metarow">
    <span class="pill" id="wkof">of 26</span>
    <span class="pill deload" id="deload" hidden>Deload week</span>
    <span class="bw">Bodyweight <input id="bw" class="num" type="number" inputmode="decimal" step="0.1" placeholder="kg" aria-label="Bodyweight in kg">kg</span>
  </div>
  <div class="hint" id="hint"></div>
</header>

<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="main"></main>

<div id="timerbar">
  <div class="trow">
    <div class="tlabel" id="tlabel"></div>
    <button class="tbtn" data-t="-15">−15</button>
    <div class="tcount num" id="tcount">0:00</div>
    <button class="tbtn" data-t="15">+15</button>
    <button class="tbtn skip" data-t="skip">Skip</button>
  </div>
  <div class="tprog"><i id="tprog"></i></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>

<script>
"use strict";

/* ---------- Plan ---------- */
const DAYS=[
  {id:'lowerA',name:'Lower A — Squat-heavy',kind:'lift',cardio:'Optional easy spin',ex:[
    {n:'Box jump (soft landing)',t:'3–4 × 3'},
    {n:'Squat',t:'4 × 5–6 · heavy'},
    {n:'Hip thrust',t:'3 × 10–12'},
    {n:'Bulgarian split squat',t:'3 × 8–10'},
    {n:'Nordic curl',t:'3 × 5–8'},
    {n:'Standing calf raise',t:'3 × 12–15'},
    {n:'Tibialis raise',t:'3 × 15–20'},
    {n:'Hip abduction (machine)',t:'3 × 15'},
    {n:'Abs — pick 2–3',t:'see reference'},
  ]},
  {id:'upperA',name:'Upper A — Heavy',kind:'lift',cardio:'Zone 2 30–45′ after',ex:[
    {n:'Handstand practice',t:'~8 min'},
    {n:'Weighted pull-ups',t:'4 × 4–6 · heavy'},
    {n:'Bench press',t:'4 × 4–6 · heavy'},
    {n:'Weighted dips',t:'3 × 6–8'},
    {n:'Chest-supported row',t:'3 × 8–10'},
    {n:'Triceps',t:'3 × 10–12'},
    {n:'Biceps',t:'3 × 10–12'},
    {n:'Face pull (opt)',t:'2 × 15'},
  ]},
  {id:'lowerB',name:'Lower B — Hip-thrust-heavy',kind:'lift',cardio:'—',ex:[
    {n:'Sprint / jump work',t:'~10 min'},
    {n:'Hip thrust',t:'4 × 5–8 · heavy'},
    {n:'Squat',t:'3 × 10–12 · volume'},
    {n:'Bulgarian split squat',t:'3 × 10–12'},
    {n:'Nordic curl',t:'3 × 6–8'},
    {n:'Seated calf raise',t:'3 × 15'},
    {n:'Tibialis raise',t:'3 × 15–20'},
    {n:'Hip adduction (machine)',t:'3 × 15'},
    {n:'Hyperextension',t:'2 × 12–15'},
    {n:'Abs — pick 2–3',t:'see reference'},
  ]},
  {id:'upperB',name:'Upper B — Endurance',kind:'lift',cardio:'Zone 2 30–45′ after',ex:[
    {n:'Handstand practice',t:'~8 min'},
    {n:'Pull-ups (bw / light)',t:'4 × 8–12'},
    {n:'Dips (bodyweight)',t:'4 × 10–15'},
    {n:'Overhead / incline press',t:'3 × 10–12'},
    {n:'Lat pulldown / row',t:'3 × 10–12'},
    {n:'Lateral raise',t:'3 × 12–15'},
    {n:'Triceps',t:'3 × 12–15'},
    {n:'Biceps',t:'3 × 12–15'},
  ]},
  {id:'cardio',name:'Cardio / base',kind:'cardio'},
];
function phaseOf(w){
  if(w<=3)return{name:'Phase 0 · Reintroduction',hint:'All lifts 10–15 reps @ RPE 6–7. Rebuild tolerance — keep it easy even if it feels too light.',deload:w===3};
  if(w<=9)return{name:'Phase 1 · Hypertrophy + Base',hint:'Heavy slots 6–8, volume slots 10–12 @ RPE 7–8. Add reps, then load.',deload:w===9};
  if(w<=15)return{name:'Phase 2 · Strength + Power',hint:'Push heavy slots to 3–6 @ RPE 8. Keep accessories moderate.',deload:w===15};
  if(w<=21)return{name:'Phase 3 · Hypertrophy Peak',hint:'8–15 reps @ RPE 8–9. Highest volume of the plan.',deload:w===21};
  return{name:'Phase 4 · Integration / Retest',hint:'Autoregulate, ~20% less volume. Retest lifts/jumps; taper on week 26.',deload:w===26};
}
const REFERENCE=`
<h4>Abs menu — pick 2–3 per leg day</h4>
<p><b>Calisthenics:</b> hanging knee raise → straight-leg raise → toes-to-bar · L-sit (tuck → full) → V-sit · windshield wipers / hanging raise with rotation · hollow hold / rocks · ab wheel (later).</p>
<p><b>Back stability (rotate one in):</b> Pallof press · side plank · suitcase carry · dead bug · bird dog.</p>
<h4>Plyometrics — simple, fresh, low volume</h4>
<p>Foundation: pogo hops · line hops · low box jump (step down). Build: higher box jump · broad jump · short sprint accelerations. Landing quality &gt; height. Shin niggle → drop a level, add tibialis.</p>
<h4>Cardio</h4>
<p>3×/week, ~80% easy Zone 2 (RPE 3–4). Bias the bike early to spare shins; phase running in ≤10%/week. Add 1 interval session from Phase 2 — never the day before legs.</p>
<h4>Low back</h4>
<p>Cranky day → front squat over back squat, lighter top-set hip thrust, lean on Nordics + hyperextensions. Don't push through pain.</p>`;
const CARDIO_TYPES=['Bike · Zone 2','Run · Zone 2','Long Zone 2','Intervals','Other'];

/* ---------- State ---------- */
const KEY='trainlog_v2';
let state=load();
let curWeek=state.lastWeek||1, curDay=state.lastDay||'lowerA', curProgEx=null;

function load(){
  try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r));}catch(e){}
  try{const old=localStorage.getItem('trainlog_v1');if(old){const o=JSON.parse(old);return migrate({bw:o.bw||{},log:o.log||{},cardio:o.cardio||{},lastWeek:o.lastWeek||1,lastDay:o.lastDay||'lowerA'});}}catch(e){}
  return migrate({});
}
function migrate(s){
  s=s||{};s.bw=s.bw||{};s.log=s.log||{};s.cardio=s.cardio||{};
  s.settings=s.settings||{};s.settings.defaultRest=s.settings.defaultRest||150;s.settings.restByEx=s.settings.restByEx||{};
  if(s.settings.sound===undefined)s.settings.sound=true;
  s.lastWeek=s.lastWeek||1;s.lastDay=s.lastDay||'lowerA';return s;
}
let saveTimer=null;
function save(){
  state.lastWeek=curWeek;state.lastDay=curDay;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Could not save — storage may be full');}},250);
}
const slot=(w,d)=>w+'|'+d;
function sessionData(w,d){const k=slot(w,d);if(!state.log[k])state.log[k]={ex:{},notes:''};return state.log[k];}
const e1rm=(kg,reps)=>kg*(1+reps/30);
const $=s=>document.querySelector(s);
const main=$('#main');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtVol(v){return v>=1000?(v/1000).toFixed(1).replace(/\.0$/,'')+'k':String(Math.round(v));}

/* ---------- Header / tabs ---------- */
function renderHeader(){
  const p=phaseOf(curWeek);
  $('#wknum').textContent='Week '+curWeek;$('#phase').textContent=p.name;$('#hint').textContent=p.hint;
  $('#deload').hidden=!p.deload;$('#prev').disabled=curWeek<=1;$('#next').disabled=curWeek>=26;
  $('#bw').value=state.bw[curWeek]!=null?state.bw[curWeek]:'';
}
function renderTabs(){
  const tabs=$('#tabs');tabs.innerHTML='';
  const items=[...DAYS.map(d=>({id:d.id,label:shortName(d.id)})),{id:'progress',label:'Progress'},{id:'records',label:'Records'}];
  items.forEach(it=>{
    const b=document.createElement('button');b.className='tab';b.textContent=it.label;b.setAttribute('role','tab');
    b.setAttribute('aria-selected',it.id===curDay?'true':'false');
    b.onclick=()=>{curDay=it.id;save();renderTabs();renderDay();window.scrollTo(0,0);};
    tabs.appendChild(b);
  });
}
const shortName=id=>({lowerA:'Lower A',upperA:'Upper A',lowerB:'Lower B',upperB:'Upper B',cardio:'Cardio',progress:'Progress',records:'Records'}[id]);

/* ---------- Day render ---------- */
function renderDay(){
  if(curDay==='progress'){renderProgress();return;}
  if(curDay==='records'){renderRecords();return;}
  const day=DAYS.find(d=>d.id===curDay);
  if(day.kind==='cardio'){renderCardio();return;}
  const sd=sessionData(curWeek,curDay);
  const sum=sessionSummary(sd);
  let html=`<h2 class="daytitle">${esc(day.name)}</h2>
    <p class="daysub">Cardio: <b>${esc(day.cardio)}</b> · rest 2–3 min on mains, superset the finisher &amp; abs.</p>
    <div class="summary"><span>Volume <b class="num">${fmtVol(sum.vol)} kg</b></span><span>Sets done <b class="num">${sum.done}</b></span>${sum.top?`<span>Top est 1RM <b class="num">${sum.top}kg</b></span>`:''}</div>`;
  html+=plateTool();
  day.ex.forEach(e=>{
    const sets=sd.ex[e.n]||[];
    html+=`<div class="ex" data-ex="${esc(e.n)}">
      <div class="exhead"><span class="exname">${esc(e.n)}</span><span class="extarget num">${esc(e.t)}</span></div>
      <div class="last">${lastWeekLine(e.n)}</div>
      ${sets.length?setsTable(sets):''}
      <div class="e1rm">${bestSetLine(sets)}</div>
      <div class="exactions"><button class="mini" data-act="add">+ Add set</button><button class="mini ghost" data-act="copy">↺ Copy last week</button></div>
    </div>`;
  });
  html+=`<div class="lbl">SESSION NOTES</div><textarea class="notes" id="notes" placeholder="How it felt, back/shin check, tweaks…">${esc(sd.notes||'')}</textarea>`;
  html+=`<details class="ref"><summary>Plan reference</summary><div class="refbody">${REFERENCE}</div></details>`;
  html+=footer();
  main.innerHTML=html;wireDay();
}
function setsTable(sets){
  const rows=sets.map((s,i)=>`<tr data-i="${i}" class="${s.done?'done':''}">
    <td class="setno num">${i+1}</td>
    <td><input class="cell num" data-f="kg" inputmode="decimal" value="${s.kg??''}" placeholder="kg"></td>
    <td><input class="cell num" data-f="reps" inputmode="numeric" value="${s.reps??''}" placeholder="reps"></td>
    <td><input class="cell num" data-f="rpe" inputmode="decimal" value="${s.rpe??''}" placeholder="RPE"></td>
    <td><button class="chk" data-act="done" aria-label="Complete set">✓</button></td>
    <td><button class="delset" data-act="del" aria-label="Delete set">✕</button></td>
  </tr>`).join('');
  return `<table class="sets"><thead><tr><th class="lead">Set</th><th>kg</th><th>reps</th><th>RPE</th><th></th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}
function sessionSummary(sd){
  let vol=0,done=0,top=0;
  for(const n in sd.ex)sd.ex[n].forEach(s=>{const k=parseFloat(s.kg),r=parseFloat(s.reps);if(k&&r){vol+=k*r;top=Math.max(top,e1rm(k,r));}if(s.done)done++;});
  return{vol,done,top:top?Math.round(top):0};
}
function bestSetLine(sets){
  let best=0,bs=null;sets.forEach(s=>{const k=parseFloat(s.kg),r=parseFloat(s.reps);if(k&&r){const e=e1rm(k,r);if(e>best){best=e;bs=s;}}});
  return bs?`best ${bs.kg}×${bs.reps} ≈ ${Math.round(best)}kg 1RM`:'';
}
function lastWeekLine(ex){
  if(curWeek<=1)return'';
  for(let w=curWeek-1;w>=1;w--){
    const sd=state.log[slot(w,curDay)],sets=sd&&sd.ex&&sd.ex[ex];
    if(sets&&sets.length){const t=sets.filter(s=>s.kg||s.reps).map(s=>`${s.kg||'–'}×${s.reps||'–'}${s.rpe?'@'+s.rpe:''}`).join('  ');if(t)return`<b>Wk ${w}:</b> ${esc(t)}`;}
  }
  return'';
}
function plateTool(){
  return `<details class="tool"><summary>Plate calculator</summary><div class="toolbody">
    <div class="prow">
      <div class="fld"><label>Target weight (kg)</label><input id="pcTarget" class="num" inputmode="decimal" placeholder="e.g. 100"></div>
      <div class="fld"><label>Bar (kg)</label><input id="pcBar" class="num" inputmode="decimal" value="20"></div>
    </div>
    <div class="plates" id="pcOut"></div>
  </div></details>`;
}

/* ---------- Day wiring ---------- */
function wireDay(){
  main.querySelectorAll('.ex').forEach(card=>{
    const ex=card.dataset.ex;
    card.querySelectorAll('input.cell').forEach(inp=>{
      inp.addEventListener('input',()=>{
        const i=+inp.closest('tr').dataset.i,f=inp.dataset.f,sd=sessionData(curWeek,curDay);
        sd.ex[ex]=sd.ex[ex]||[];sd.ex[ex][i]=sd.ex[ex][i]||{};sd.ex[ex][i][f]=inp.value;save();
        card.querySelector('.e1rm').textContent=bestSetLine(sd.ex[ex]);
      });
    });
    card.querySelectorAll('[data-act]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const act=btn.dataset.act,sd=sessionData(curWeek,curDay);
        if(act==='add'){sd.ex[ex]=sd.ex[ex]||[];sd.ex[ex].push({});save();renderDay();}
        else if(act==='del'){const i=+btn.closest('tr').dataset.i;sd.ex[ex].splice(i,1);save();renderDay();}
        else if(act==='copy'){copyLast(ex);}
        else if(act==='done'){toggleDone(ex,btn);}
      });
    });
  });
  const notes=$('#notes');if(notes)notes.addEventListener('input',()=>{sessionData(curWeek,curDay).notes=notes.value;save();});
  wirePlate();wireFooter();
}
function toggleDone(ex,btn){
  unlockAudio();
  const tr=btn.closest('tr'),i=+tr.dataset.i,sd=sessionData(curWeek,curDay);
  sd.ex[ex]=sd.ex[ex]||[];sd.ex[ex][i]=sd.ex[ex][i]||{};
  const set=sd.ex[ex][i];set.done=!set.done;tr.classList.toggle('done',set.done);save();
  if(set.done){
    const k=parseFloat(set.kg),r=parseFloat(set.reps);
    if(k&&r){const prev=bestE1RMExcluding(ex,set);if(e1rm(k,r)>prev+0.05)toast('🔥 New PR · '+set.kg+'×'+set.reps+' ≈ '+Math.round(e1rm(k,r))+'kg 1RM');}
    startRest(ex);
  }
}
function copyLast(ex){
  for(let w=curWeek-1;w>=1;w--){
    const sd=state.log[slot(w,curDay)],sets=sd&&sd.ex&&sd.ex[ex];
    if(sets&&sets.length){sessionData(curWeek,curDay).ex[ex]=sets.map(s=>({kg:s.kg,reps:s.reps,rpe:s.rpe}));save();renderDay();toast('Copied week '+w);return;}
  }
  toast('No earlier data to copy');
}
function bestE1RMExcluding(ex,exclude){
  let best=0;
  for(const key in state.log){const arr=state.log[key].ex&&state.log[key].ex[ex];if(!arr)continue;arr.forEach(s=>{if(s===exclude)return;const k=parseFloat(s.kg),r=parseFloat(s.reps);if(k&&r)best=Math.max(best,e1rm(k,r));});}
  return best;
}
function wirePlate(){
  const t=$('#pcTarget'),b=$('#pcBar'),o=$('#pcOut');if(!t)return;
  const calc=()=>{
    const target=parseFloat(t.value),bar=parseFloat(b.value)||20;
    if(!target){o.innerHTML='';return;}
    const per=(target-bar)/2;
    if(per<0){o.innerHTML='<span style="color:var(--faint)">Target is below the bar weight.</span>';return;}
    const avail=[25,20,15,10,5,2.5,1.25];let rem=per,out=[];
    avail.forEach(p=>{while(rem>=p-1e-9){out.push(p);rem=+(rem-p).toFixed(4);}});
    let html=`<b>${per.toFixed(2).replace(/\.00$/,'')} kg per side:</b><br>`;
    html+=out.length?out.map(p=>`<span class="p num">${p}</span>`).join(''):'<span style="color:var(--faint)">just the bar</span>';
    if(rem>0.01)html+=`<br><span style="color:var(--faint);font-size:.8rem">(${rem.toFixed(2)} kg short — nearest with standard plates)</span>`;
    o.innerHTML=html;
  };
  t.addEventListener('input',calc);b.addEventListener('input',calc);
}

/* ---------- Cardio ---------- */
function renderCardio(){
  const c=state.cardio[curWeek]||[],sessions=c.length?c:[{}];
  let html=`<h2 class="daytitle">Cardio / base</h2><p class="daysub">Easy <b>Zone 2</b> most days · one long session · bias the bike early.</p><div id="cardiolist">`;
  sessions.forEach((s,i)=>html+=cardioCard(s,i));
  html+=`</div><button class="mini" id="addcardio" style="width:100%;margin-top:2px">+ Add cardio session</button>`+footer();
  main.innerHTML=html;wireCardio();
}
function cardioCard(s,i){
  const opts=CARDIO_TYPES.map(t=>`<option ${s.type===t?'selected':''}>${t}</option>`).join('');
  return `<div class="ex" data-i="${i}">
    <div class="field"><label>Type</label><select data-f="type"><option value="">—</option>${opts}</select></div>
    <div class="field"><label>Duration (min)</label><input class="big num" data-f="min" inputmode="numeric" value="${s.min??''}" placeholder="e.g. 40"></div>
    <div class="field"><label>Notes</label><input class="big" data-f="notes" value="${esc(s.notes||'')}" placeholder="avg HR, how it felt…"></div>
    <button class="mini ghost" data-act="delc">Remove</button></div>`;
}
function wireCardio(){
  main.querySelectorAll('#cardiolist .ex').forEach(card=>{
    const i=+card.dataset.i;
    card.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',()=>{state.cardio[curWeek]=state.cardio[curWeek]||[];state.cardio[curWeek][i]=state.cardio[curWeek][i]||{};state.cardio[curWeek][i][el.dataset.f]=el.value;save();}));
    const del=card.querySelector('[data-act="delc"]');if(del)del.addEventListener('click',()=>{state.cardio[curWeek]=state.cardio[curWeek]||[];state.cardio[curWeek].splice(i,1);save();renderCardio();});
  });
  $('#addcardio').addEventListener('click',()=>{state.cardio[curWeek]=state.cardio[curWeek]||[];if(!state.cardio[curWeek].length)state.cardio[curWeek].push({});state.cardio[curWeek].push({});save();renderCardio();});
  wireFooter();
}

/* ---------- Progress ---------- */
function allExercises(){
  const seen={},list=[];
  DAYS.forEach(d=>{if(d.kind!=='lift')return;d.ex.forEach(e=>{if(!seen[e.n]){seen[e.n]=1;list.push(e.n);}});});
  return list;
}
function weeklyStats(ex){
  const out=[];
  for(let w=1;w<=26;w++){
    let best=0,vol=0,has=false;
    DAYS.forEach(d=>{if(d.kind!=='lift')return;const arr=state.log[slot(w,d.id)]&&state.log[slot(w,d.id)].ex&&state.log[slot(w,d.id)].ex[ex];if(!arr)return;arr.forEach(s=>{const k=parseFloat(s.kg),r=parseFloat(s.reps);if(r){has=true;if(k){best=Math.max(best,e1rm(k,r));vol+=k*r;}}});});
    if(has)out.push({w,best:Math.round(best),vol:Math.round(vol)});
  }
  return out;
}
function bwSeries(){const out=[];for(let w=1;w<=26;w++){const v=state.bw[w];if(v!=null&&v!=='')out.push({w,v:parseFloat(v)});}return out;}
function chart(points,color){
  if(points.length<2)return '<div class="empty">Log at least two weeks to see a trend.</div>';
  const W=320,H=150,pl=32,pr=10,pt=12,pb=22;
  const ys=points.map(p=>p.y);let ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(ymin===ymax){ymin-=1;ymax+=1;}const pad=(ymax-ymin)*0.12;ymin-=pad;ymax+=pad;
  const X=i=>pl+(W-pl-pr)*(i/(points.length-1));
  const Y=v=>pt+(H-pt-pb)*(1-(v-ymin)/(ymax-ymin));
  const d=points.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const dots=points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="${color}"/>`).join('');
  const yl=v=>`<text x="${pl-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" class="axl">${Math.round(v)}</text>`;
  const xl=i=>`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" class="axl">W${points[i].x}</text>`;
  let xs=xl(0)+xl(points.length-1);if(points.length>3)xs+=xl(Math.floor((points.length-1)/2));
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">
    <line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" class="axis"/><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" class="axis"/>
    ${yl(ymax)}${yl(ymin)}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xs}</svg>`;
}
function records(){
  const res=[];
  allExercises().forEach(ex=>{
    let best=null,heavy=null;
    for(const key in state.log){
      const arr=state.log[key].ex&&state.log[key].ex[ex];if(!arr)continue;
      const w=+key.split('|')[0];
      arr.forEach(s=>{const k=parseFloat(s.kg),r=parseFloat(s.reps);if(k&&r){const e=e1rm(k,r);if(!best||e>best.e)best={e,k,r,w};if(!heavy||k>heavy.k)heavy={k,r,w};}});
    }
    if(best)res.push({ex,best,heavy});
  });
  res.sort((a,b)=>b.best.e-a.best.e);
  return res;
}
function renderRecords(){
  const rs=records();
  let html=`<h2 class="daytitle">Records</h2><p class="daysub">Best estimated 1RM and heaviest set per lift.</p>`;
  if(!rs.length){html+=`<div class="empty">Complete some sets with weight &amp; reps to start setting records.</div>`;}
  else rs.forEach(r=>{
    html+=`<div class="ex"><div class="exhead"><span class="exname">${esc(r.ex)}</span><span class="extarget num">≈ ${Math.round(r.best.e)} kg 1RM</span></div>
      <div class="last"><b>Best:</b> ${r.best.k}×${r.best.r} (Wk ${r.best.w}) · <b>Heaviest:</b> ${r.heavy.k}×${r.heavy.r} (Wk ${r.heavy.w})</div></div>`;
  });
  html+=footer();
  main.innerHTML=html;wireFooter();
}
function renderProgress(){
  const exs=allExercises();
  if(!curProgEx||exs.indexOf(curProgEx)<0)curProgEx=exs.indexOf('Squat')>=0?'Squat':exs[0];
  const st=weeklyStats(curProgEx);
  const best=st.reduce((m,p)=>Math.max(m,p.best),0);
  const bw=bwSeries();
  let html=`<h2 class="daytitle">Progress</h2><p class="daysub">Trends update as you log. Estimated 1RM uses the Epley formula.</p>`;
  html+=`<div class="card"><h3>Exercise</h3>
    <select id="progsel" style="width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0 6px">${exs.map(n=>`<option ${n===curProgEx?'selected':''}>${esc(n)}</option>`).join('')}</select>
    ${best?`<div class="best">Best est 1RM: ${best} kg</div>`:''}
    <div class="twocharts"><h4>Estimated 1RM (kg) by week</h4>${chart(st.map(p=>({x:p.w,y:p.best})),'#FFB020')}
    <h4>Volume (kg) by week</h4>${chart(st.map(p=>({x:p.w,y:p.vol})),'#3FC7B4')}</div></div>`;
  html+=`<div class="card"><h3>Bodyweight</h3><div class="cap">Target 79 → 85 kg lean</div>${chart(bw.map(p=>({x:p.w,y:p.v})),'#FF6A3D')}</div>`;
  html+=`<div class="card"><h3>Rest timer</h3><div class="cap">Auto-starts when you complete a set. Adjust per-exercise with ±15 on the timer bar.</div>
    <div class="prow" style="align-items:center">
      <div class="fld"><label>Default rest (seconds)</label><input id="defrest" class="num" inputmode="numeric" value="${state.settings.defaultRest}"></div>
      <div class="fld"><label>Sound</label><button id="soundtog" class="mini" style="flex:none">${state.settings.sound?'On':'Off'}</button></div>
    </div></div>`;
  html+=footer();
  main.innerHTML=html;
  $('#progsel').addEventListener('change',e=>{curProgEx=e.target.value;renderProgress();});
  $('#defrest').addEventListener('input',e=>{const v=parseInt(e.target.value,10);if(v>0){state.settings.defaultRest=v;save();}});
  $('#soundtog').addEventListener('click',e=>{unlockAudio();state.settings.sound=!state.settings.sound;e.target.textContent=state.settings.sound?'On':'Off';save();if(state.settings.sound)beep();});
  wireFooter();
}

/* ---------- Footer / export ---------- */
function footer(){return `<div class="foot"><button class="primary" id="exportbtn">Export backup</button><button id="importbtn">Load backup</button></div><div class="credit">Data is saved on this device only. Export regularly to keep a backup.</div>`;}
function wireFooter(){const e=$('#exportbtn'),i=$('#importbtn');if(e)e.addEventListener('click',doExport);if(i)i.addEventListener('click',()=>$('#importfile').click());}
function doExport(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date().toISOString().slice(0,10);
  a.href=url;a.download='training-log-'+d+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded');
}
$('#importfile').addEventListener('change',ev=>{
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;state=migrate({bw:d.bw,log:d.log,cardio:d.cardio,settings:d.settings,lastWeek:d.lastWeek,lastDay:d.lastDay});curWeek=state.lastWeek;curDay=state.lastDay;save();renderAll();toast('Backup loaded');}catch(e){toast('That file could not be read');}ev.target.value='';};
  r.readAsText(f);
});

/* ---------- Rest timer ---------- */
let timer={end:0,dur:0,ex:'',active:false,fired:false};
let tick=null,actx=null;
function unlockAudio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){try{if(!actx||!state.settings.sound)return;[0,0.18].forEach(off=>{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.value=880;const t0=actx.currentTime+off;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.3,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.14);o.start(t0);o.stop(t0+0.16);});}catch(e){}}
function startRest(ex){
  const dur=state.settings.restByEx[ex]||state.settings.defaultRest||150;
  timer={end:Date.now()+dur*1000,dur,ex,active:true,fired:false};
  document.body.classList.add('timer-active');$('#timerbar').classList.remove('done');
  renderTimer();if(tick)clearInterval(tick);tick=setInterval(renderTimer,250);
}
function renderTimer(){
  if(!timer.active)return;
  const remMs=timer.end-Date.now(),rem=Math.max(0,Math.round(remMs/1000));
  $('#tcount').textContent=timer.fired?'Rest complete':(Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0'));
  $('#tlabel').innerHTML='Rest · <b>'+esc(timer.ex)+'</b>';
  $('#tprog').style.width=Math.max(0,Math.min(100,(remMs/(timer.dur*1000))*100))+'%';
  if(remMs<=0&&!timer.fired){timer.fired=true;$('#timerbar').classList.add('done');if(document.visibilityState==='visible')beep();if(navigator.vibrate)navigator.vibrate([120,60,120]);setTimeout(()=>{if(timer.fired)stopRest();},4000);}
}
function stopRest(){timer.active=false;if(tick){clearInterval(tick);tick=null;}document.body.classList.remove('timer-active');}
document.querySelectorAll('#timerbar .tbtn').forEach(b=>b.addEventListener('click',()=>{
  const t=b.dataset.t;
  if(t==='skip'){stopRest();return;}
  if(!timer.active)return;const d=parseInt(t,10);timer.end+=d*1000;timer.dur=Math.max(5,timer.dur+d);state.settings.restByEx[timer.ex]=timer.dur;save();
  if(timer.fired&&timer.end-Date.now()>0){timer.fired=false;$('#timerbar').classList.remove('done');}
  renderTimer();
}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&timer.active)renderTimer();});

/* ---------- Misc ---------- */
$('#bw').addEventListener('input',e=>{const v=e.target.value;if(v==='')delete state.bw[curWeek];else state.bw[curWeek]=v;save();});
$('#prev').addEventListener('click',()=>{if(curWeek>1){curWeek--;save();renderAll();window.scrollTo(0,0);}});
$('#next').addEventListener('click',()=>{if(curWeek<26){curWeek++;save();renderAll();window.scrollTo(0,0);}});
let toastTimer=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900);}

function renderAll(){renderHeader();renderTabs();renderDay();}
renderAll();
</script>
</body>
</html>
